source: https://docs.coro.net/admin/mcpserver.md
description: Coro publishes an official, hosted MCP (Model Context Protocol) server that acts as a secure
  intermediary between an organization's AI tools and Coro's workspace security data. The MCP server authenticates
  and validates each request, translates it into one or more calls to Coro's public REST API, and returns
  a normalized JSON response. Connections require an existing Coro console account with an admin role
  (Workspace administrator/super admin or MSP administrator/super admin).
server:
  name: coro
  transport: http
  regions:
  - region: us
    url: https://api.secure.coro.net/mcp
  - region: ca
    url: https://api.secure-ca.coro.net/mcp
  - region: eu
    url: https://api.secure-eu.coro.net/mcp
auth:
  type: oauth2
  flow: authorization_code
  metadata: well-known/coro-oauth-authorization-server.json
  authorization_endpoint: https://secure.coro.net/mcp/oauth/consent
  token_endpoint: https://api.secure.coro.net/mcp/oauth/token
  registration_endpoint: https://api.secure.coro.net/mcp/oauth/register
  code_challenge_methods:
  - S256
  clients:
  - ChatGPT Apps
  - Claude Connectors
