aid: coro
name: Coro
description: >-
  Coro is a cybersecurity company that consolidates endpoint protection, email
  security, network protection (ZTNA, VPN, encryption), cloud app security, data
  protection, and security awareness training into a single AI-driven platform
  built for lean IT teams, growing organizations, and managed service providers
  (MSPs). Coro's public REST API (v1) exposes the same workspace security data
  through region-specific hosts (US, Canada, Germany), organized around workspaces
  as tenant containers with subscriptions, tickets, devices, protected users,
  portal users, usage metrics, audit logs, and webhook configurations. It
  authenticates with OAuth 2.0 client credentials and offers real-time webhooks
  and an official MCP server so AI tools can query Coro securely. Coro was surfaced
  as a portfolio company of Balderton Capital.
